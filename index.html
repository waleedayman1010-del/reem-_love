
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Reem ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
    text-align: center;
}

.container {
    padding: 25px;
}

h1 {
    font-size: 32px;
    margin-bottom: 30px;
}

button {
    padding: 15px 45px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #e84375;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

#secondPage {
    display: none;
    animation: appear 1.5s ease;
}

#secondPage h1 {
    font-size: 42px;
}

.heart {
    position: absolute;
    bottom: -30px;
    animation: float 6s linear infinite;
    font-size: 25px;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@keyframes appear {
    from {opacity: 0; transform: scale(0.5);}
    to {opacity: 1; transform: scale(1);}
}
</style>
</head>

<body>

<div class="container" id="firstPage">
    <h1>دوسي ENTER يا بت 😂❤️</h1>
    <button onclick="openPage()">ENTER ❤️</button>
</div>

<div class="container" id="secondPage">
    <h1>بحبك يا ريم ❤️</h1>
</div>

<script>
function openPage() {
    document.getElementById("firstPage").style.display = "none";
    document.getElementById("secondPage").style.display = "block";
}

setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 500);
</script>

</body>
</html>
